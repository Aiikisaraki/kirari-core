# electron-builder 配置：单机版（前后端一体安装包）
# 构建：npm run dist  （会先 vite build，再打包 NSIS 安装向导）
appId: com.akisaki.kirari
productName: Aki Kirari 桌宠
# 二进制文件名用 ASCII，降低杀软对非 ASCII Electron exe 的启发式扫描/误报
# （显示名/开始菜单/快捷方式仍由 productName / shortcutName 控制，保持中文）
executableName: aki-kirari-pet
copyright: Copyright © 2026 Aki

# 明确禁用 electron-builder 自带的 GitHub 发布器：
# 发版完全交给 GitHub Actions 的 softprops/action-gh-release 负责，这里只构建安装包、不发布，
# 避免 electron-builder 尝试读取 GH_TOKEN 而报
# “GitHub Personal Access Token is not set, neither programmatically, nor using env 'GH_TOKEN'”。
publish: null

# 应用图标：嵌入 exe，决定任务栏 / 文件 / 标题栏（有边框窗口）图标
icon: build-resources/icons/app-icon.ico

directories:
  output: release
  buildResources: build-resources

# 随应用打包的前端产物（vite 输出 dist + 主进程 dist-electron）
files:
  - dist
  - dist-electron
  - package.json

# 桌面快捷方式使用的独立图标：打包进安装根目录，供 NSIS 创建桌面快捷方式时引用
extraFiles:
  - from: build-resources/icons/shortcut-icon.ico
    to: shortcut-icon.ico
  # 官方皮肤安装脚本：由 NSIS 在安装阶段调用，一次性释放到用户数据目录。
  - from: build-resources/install-avatars.ps1
    to: install-avatars.ps1

# 额外资源：
#   - 后端 API（不含 node_modules）：从 build-resources/pet-api-bundle（prepack 生成）打包。
#     node_modules 由 afterPack 钩子强制复制（electron-builder 默认排除 node_modules，与 gitignore 无关）。
#   - Node 运行时：从 build-resources/backend-runtime 打包进 resources/pet-api/runtime。
#   - 官方皮肤：把项目 resources/official-avatars 下所有皮肤子目录打包进安装包的
#     resources/official-avatars，安装阶段由 NSIS 脚本一次性释放到 userData/avatars。
#     应用启动后不再替换皮肤（仅开发模式下首次启动且目录为空时兜底复制）。
extraResources:
  - from: resources/official-avatars
    to: official-avatars
    filter:
      - "**/*"
  - from: build-resources/pet-api-bundle
    to: pet-api
    filter:
      - "**/*"
      - "!**/*.log"
      - "!**/node_modules/**"
  - from: build-resources/backend-runtime
    to: pet-api/runtime

# 打包完成后钩子：强制注入后端 node_modules（绕过 extraResources 的默认 node_modules 排除规则）
afterPack: scripts/after-pack.cjs

win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}

# Windows 安装向导：非一键安装，允许用户选择目录、创建桌面快捷方式。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aki Kirari 桌宠
  # 安装包 / 卸载程序图标（与 exe 图标一致，均为软件图标 app-icon.ico）
  installerIcon: build-resources/icons/app-icon.ico
  uninstallerIcon: build-resources/icons/app-icon.ico
  # 安装向导欢迎页 / 完成页左侧侧边栏图片（164×314 BMP）
  installerSidebar: build-resources/icons/installer-sidebar.bmp
  installerLanguages:
    - zh_CN
    - en
  # 自定义安装向导页（模型配置）：插入到"选择安装目录"之后、"开始安装"之前
  include: build-resources/installer.nsh
