name: Release (kirari-desktop)

# ─────────────────────────────────────────────────────────────────────────────
# 触发方式
#   1) 推送 tag  vX.Y.Z   → 自动打包并发布该版本 Release（覆盖同名旧 Release）
#   2) 手动在 Actions 页面点击 Run workflow
#        - version：可填指定版本（如 0.1.2），留空则用 package.json 当前版本
#        - overwrite：是否覆盖同名旧 Release（默认 true）
#
# 注意：推送到 main 不再触发任何构建，避免每次提交都跑 workflow。
#       要发版请打 tag：  git tag vX.Y.Z && git push origin vX.Y.Z
#       或到 Actions 页面手动 Run。
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要打包发布的版本号（如 0.1.2）。留空则使用 package.json 中的 version。"
        required: false
        default: ""
      overwrite:
        description: "若同名版本 Release 已存在，是否覆盖它。"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout frontend (kirari-desktop)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout backend (kirari-core)
        uses: actions/checkout@v4
        with:
          repository: Aiikisaraki/kirari-core
          path: _backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VER (tag v$VER)"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies (native module for Node 24 / ABI 137)
        working-directory: _backend
        run: npm ci

      - name: Build & package Windows installer (local all-in-one)
        env:
          PET_API_SOURCE_DIR: ${{ github.workspace }}/_backend
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      # 覆盖同名旧 Release：删除旧的 release 与 tag
      - name: Delete existing same-version release (overwrite)
        if: github.event.inputs.overwrite == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true
          git push --delete origin "$TAG" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: release/*Setup*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
